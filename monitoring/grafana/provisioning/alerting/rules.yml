apiVersion: 1

groups:
  - orgId: 1
    name: system-health
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: memory-high
        title: "Memory usage above 90%"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"
              refId: A
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
              refId: C
        for: 10m
        annotations:
          summary: "System memory usage has been above 90% for 10 minutes."
        labels:
          severity: critical

      - uid: cpu-high
        title: "CPU usage above 95%"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
              refId: A
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 95
              refId: C
        for: 10m
        annotations:
          summary: "CPU usage has been above 95% for 10 minutes."
        labels:
          severity: critical

      - uid: swap-high
        title: "Swap usage above 1 GiB"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes"
              refId: A
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1073741824
              refId: C
        for: 10m
        annotations:
          summary: "Swap usage has been above 1 GiB for 10 minutes."
        labels:
          severity: warning

      - uid: disk-high
        title: "Disk usage above 90%"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!=\"tmpfs\"})) * 100"
              refId: A
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: mean
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
              refId: C
        for: 5m
        annotations:
          summary: "Disk usage on / has exceeded 90%."
        labels:
          severity: warning
