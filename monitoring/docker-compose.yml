x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_STORAGE_SIZE:-2GB}"
    depends_on:
      - cadvisor
      - node_exporter
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8089}:8080"
    networks:
      - monitoring
    logging: *default-logging

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:${NODE_EXPORTER_PORT:-9109}:9100"
    networks:
      - monitoring
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    # Loki flushes chunks and closes its WAL on shutdown; the default 10s kill corrupts the WAL
    stop_grace_period: 2m
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/overrides.yml:/etc/loki/overrides.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - monitoring
    mem_limit: 1g
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/main.alloy"
    environment:
      - LOKI_PUSH_URL=http://loki:3100/loki/api/v1/push
      - SERVER_LABEL=${SERVER_LABEL:?set SERVER_LABEL in .env}
    volumes:
      - ./alloy/main.alloy:/etc/alloy/main.alloy:ro
      - ./alloy/lib.alloy:/etc/alloy/lib.alloy:ro
      - ${PORTAL_LOG_DIR:?set PORTAL_LOG_DIR in .env}:/logs/portal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    networks:
      - monitoring
    mem_limit: 512m
    depends_on:
      - loki
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_INITIAL_ADMIN_PASSWORD}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:${SMTP_PORT:-465}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM}
      - GF_SMTP_FROM_NAME=${SMTP_FROM_NAME:-Monitoring}
      - GF_SMTP_STARTTLS_POLICY=NoStartTLS
      - GF_SERVER_ROOT_URL=${GRAFANA_PUBLIC_URL:?set GRAFANA_PUBLIC_URL in .env}
      # Login through Cloudflare Access: Grafana verifies the JWT that Access signs on every request,
      # creates the user on first login and puts them in the Staff org as Editor.
      # The local admin login keeps working through the SSH port forward.
      - GF_AUTH_JWT_ENABLED=true
      - GF_AUTH_JWT_HEADER_NAME=Cf-Access-Jwt-Assertion
      - GF_AUTH_JWT_EMAIL_CLAIM=email
      - GF_AUTH_JWT_USERNAME_CLAIM=email
      - GF_AUTH_JWT_JWK_SET_URL=https://${CF_ACCESS_TEAM_DOMAIN:?set CF_ACCESS_TEAM_DOMAIN in .env}/cdn-cgi/access/certs
      - GF_AUTH_JWT_EXPECT_CLAIMS={"aud":"${CF_ACCESS_AUD:?set CF_ACCESS_AUD in .env}","iss":"https://${CF_ACCESS_TEAM_DOMAIN}"}
      - GF_AUTH_JWT_AUTO_SIGN_UP=true
      # Keeps roles changed by hand (an admin promoted in the UI) across logins
      - GF_AUTH_JWT_SKIP_ORG_ROLE_SYNC=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ID=2
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Editor
      # Read by grafana/provisioning/datasources/postgres.yml
      - PORTAL_DB_CONTAINER=${PORTAL_DB_CONTAINER:?set PORTAL_DB_CONTAINER in .env}
      - PORTAL_DB_NAME=${PORTAL_DB_NAME:?set PORTAL_DB_NAME in .env}
      - PORTAL_DB_READER_PASSWORD=${PORTAL_DB_READER_PASSWORD:?set PORTAL_DB_READER_PASSWORD in .env}
      - ALEXANDRIA_DB_CONTAINER=${ALEXANDRIA_DB_CONTAINER:?set ALEXANDRIA_DB_CONTAINER in .env}
      - ALEXANDRIA_DB_NAME=${ALEXANDRIA_DB_NAME:?set ALEXANDRIA_DB_NAME in .env}
      - ALEXANDRIA_DB_READER_PASSWORD=${ALEXANDRIA_DB_READER_PASSWORD:?set ALEXANDRIA_DB_READER_PASSWORD in .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3009}:3000"
    networks:
      - monitoring
      # The applications' network, to reach their databases by container name
      - apps
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
      - loki
    logging: *default-logging

  # Outbound-only tunnel to Cloudflare; serves Grafana on GRAFANA_PUBLIC_URL behind Cloudflare Access.
  # Routes and Access policies are configured in the Cloudflare dashboard (README "Access").
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:?set CLOUDFLARED_TUNNEL_TOKEN in .env}
    networks:
      - monitoring
    depends_on:
      - grafana
    mem_limit: 256m
    logging: *default-logging

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

networks:
  monitoring:
    driver: bridge
  apps:
    external: true
    name: ${APPS_NETWORK:?set APPS_NETWORK in .env}
