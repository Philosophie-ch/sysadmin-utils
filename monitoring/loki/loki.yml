auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-10-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  chunk_encoding: zstd

pattern_ingester:
  enabled: true

querier:
  multi_tenant_queries_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Defaults for every tenant ("staff"); per-tenant overrides live in overrides.yml
limits_config:
  retention_period: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true
  allow_structured_metadata: true
  # Counting by an extracted label (paths during a crawl) needs more than the default 500
  max_query_series: 20000

runtime_config:
  file: /etc/loki/overrides.yml

analytics:
  reporting_enabled: false
